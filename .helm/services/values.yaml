secrets:
  deps_meta_agent:
    secretName: deps-meta-agent
  api_key:
    secretName: api-key
  meta_agent_database:
    secretName: meta-agent-database
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  common_secret:
    secretName: common-secret
  rabbitmq_password:
    secretName: rabbitmq-password
  security_certs:
    secretName: security-certs
  redis_password:
    secretName: redis-password
  kafka_secrets:
    secretName: kafka-secrets
  database_ssl_secret:
    secretName: database-ssl-secret
  telemetry_secrets:
    secretName: telemetry-secrets
  ai_fusion_providers:
    secretName: ai-fusion-providers

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

registry: ""
env: ""

meta_agent:
  replicaCount: 1
  image:
    path: "/deps-dev-x01/deps-meta-agent"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

meta_agent_consumer:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-meta-agent'
    pullPolicy: IfNotPresent
    tag: ''
  imagePullSecrets: artifactory
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

certs_location:
  certs_default_path: "/tmp/ssl"
  database_sslcerts_path: "/home/dbcerts"

meta_agent_settings:
  ENV: dev

  DATABASE_PORT: '5432'
  DATABASE_DRIVER: psycopg2
  DATABASE_DIALECT: postgresql
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  DATABASE_SSLKEY_PATH: "/home/dbcerts/tls.key"
  DATABASE_SSLCERT_PATH: "/home/dbcerts/tls.crt"
  DATABASE_SSLROOTCERT_PATH: "/home/dbcerts/root.crt"

  AUTH_VERIFY_SSL: false

  LOG_LEVEL: "INFO"
  DOCUMENTATION_ENABLED: "true"

  RABBITMQ_TLS_ENABLED: false

  KAFKA_GROUP_ID: meta-agent
  KAFKA_AUTO_OFFSET_RESET: earliest
  KAFKA_SECURITY_ENABLED: false

  # Azure Service Bus
  ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'

  # Agentic AI
  AGENTIC_AI_URL: "http://agentic-ai:8000"
  META_AGENT_URL: "http://meta-agent:8000/api/meta-agent/v1/chat"

  # Telemetry
  INSTRUMENTATION_ENABLED: false
  SERVICE_NAME: meta-agent
  EXPORTER_TYPE: azure

  # Orchestrator LLM settings
  ORCHESTRATOR_PROVIDER_ID: EPAM_DIAL
  ORCHESTRATOR_MODEL_ID: gpt-4o
  ORCHESTRATOR_MAX_ITERATIONS: 3

  EPAM_DIAL_ENDPOINT: https://openai_host
  EPAM_DIAL_API_VERSION: '2025-04-01-preview'

  AZURE_API_ENDPOINT: https://openai_host
  AZURE_API_VERSION: '2025-04-01-preview'

  AWS_REGION: us-east-1

helm:
  helm_logs_job_enabled: false

message_broker_asb_without_manage_permission:
  enabled: false

csi:
  csi_default_name: deps-meta-agent
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

vault_settings:
  enabled: false
  hashicorp_vault: false
  azure_key_vault: false
  gcp_secret_manager: false
  aws_secret_manager: false
  aws_secret_manager_region: ''

meta_agent_vault_enabled:
  env:
  - name: AUTH_CERTS_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: keycloak-certs-endpoint
  - name: MESSAGING_DRIVER
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: message-broker-driver
  - name: MESSAGE_BROKER_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: message-broker-connection-string
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: database-host
  - name: DATABASE_DB
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: database-db
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: user
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: password
  - name: EPAM_DIAL_API_KEY
    valueFrom:
      secretKeyRef:
        name: deps-meta-agent
        key: epam-dial-api-key
  - name: AZURE_API_KEY
    valueFrom:
