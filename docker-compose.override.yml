services:
  api:
    build:
      context: .
      dockerfile: ./etc/meta-agent/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "meta-agent-dev:latest"
    env_file:
      - ./etc/meta-agent/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_meta_agent:/app/deps_meta_agent
      - ./src/tests:/app/tests
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
      - ./src/setup.cfg:/app/setup.cfg
    ports:
      - "8033:8000"
    stdin_open: true
    tty: true

  consumer:
    build:
      context: .
      dockerfile: ./etc/meta-agent/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "meta-agent-dev:latest"
    env_file:
      - ./etc/meta-agent/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_meta_agent:/app/deps_meta_agent
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
    stdin_open: true
    tty: true

  migrator:
    build:
      context: .
      dockerfile: ./etc/migrator/Dockerfile
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "meta-agent-migrator:latest"
    env_file: ./etc/migrator/env/.dev.env
    networks:
      - deps-network
    volumes:
      - ./etc/migrator/migrations:/app/migrations

networks:
  deps-network:
    external: True
