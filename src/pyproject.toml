[tool.poetry]
name = "meta_agent"
version = "0.1.0"
description = "Short description of project"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
dependency-injector = ">=4.41.0,<5.0.0"
pydantic = "^2"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.135.0"
SQLAlchemy = "^2"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
httpx = "^0.28.1"
requests = "^2.31.0"
pydantic-settings = "^2.10.1"
sse-starlette = "^2.0.0"
langgraph = "^1.1.2"
langchain-core = "^1.0.0"
langchain-openai = "^1.1.11"
langchain-google-genai = "^4.2.1"
langchain-aws = "^1.4.0"
httpx-retries = "^0.4.5"


[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^7.3"
wemake-python-styleguide = "^1.2"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.25.6"
requests-mock = "~1.9.3"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''
